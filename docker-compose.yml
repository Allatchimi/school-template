services:
  template:
    container_name: template
    build:
      context: .
      target: runner
      dockerfile: ./docker/app/Dockerfile
    restart: on-failure
    env_file:
    - ./.env
    ports:
      - "13000:3000"
    networks:
        - school-network

networks:
  school-network:
    name: school-network
    external: true
